  <body class="bg-[#0d1117] text-[#e6edf3] overflow-hidden select-none" oncontextmenu="return false;">
    <div id="root"></div>
    <script>
      // If running on localhost / development, unregister any active Service Workers so they never intercept Vite dev server
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.unregister();
              console.log('[Dev] Unregistered active Service Worker on localhost');
            }
          });
          if ('caches' in window) {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
          }
        } else {
          // Register Service Worker for PWA Desktop Installability in production
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              try { reg.update(); } catch (e) {}
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  };
                }
              };
            }).catch(() => {});
          });
        }
      }
    </script>
