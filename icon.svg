<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Crimson to Cyber Purple Gradient -->
    <linearGradient id="tc-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Electric Cyan Accent -->
    <linearGradient id="tc-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff0055" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Canvas for PWA App Icon -->
  <rect width="512" height="512" rx="120" fill="#090d16" />

  <!-- Outer Cyber Gaming Shield -->
  <path 
    d="M256 36 L440 98 L440 286 Q440 422 256 476 Q72 422 72 286 L72 98 Z" 
    fill="url(#tc-bg)" 
    stroke="url(#tc-crimson)" 
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Inner Cyber Contour -->
  <path 
    d="M256 68 L406 122 L406 276 Q406 388 256 436 Q106 388 106 276 L106 122 Z" 
    fill="none" 
    stroke="#38bdf8" 
    stroke-width="6" 
    stroke-opacity="0.3" 
  />

  <!-- Central Turkish Gaming Crescent & Cyber Wing -->
  <g filter="url(#tc-glow)">
    <!-- Turkish Hilal Crescent Wing -->
    <path 
      d="M256 120 C176 120 114 184 114 266 C114 348 176 412 256 412 C196 376 166 322 166 266 C166 210 196 156 256 120 Z" 
      fill="url(#tc-crimson)" 
    />

    <!-- Cyber Falcon Gaming Wing / Claw on the Right -->
    <path 
      d="M290 148 L374 206 L344 264 L388 304 L320 354 L280 314 L310 254 Z" 
      fill="url(#tc-crimson)" 
      fill-opacity="0.9"
    />

    <!-- Central Gaming Star / Diamond Power Core -->
    <polygon 
      points="266,204 286,252 334,266 286,280 266,328 246,280 198,266 246,252" 
      fill="url(#tc-cyan)" 
    />

    <!-- Core Bright White Light -->
    <circle cx="266" cy="266" r="12" fill="#ffffff" />
  </g>
</svg>
